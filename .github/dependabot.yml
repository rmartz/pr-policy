version: 2
# Cooldown: since 2026-07-14 Dependabot waits 3 days after a release before
# proposing it, even with no `cooldown` configured. Third-party dependencies keep
# that default (security updates are never delayed by it). Only first-party
# releases (`rmartz/*` actions and reusable workflows) are exempt: they're
# published from our own repos with provenance, so the wait adds no supply-chain
# protection and only holds fixes back from the fleet.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # Explicit, so declaring the block can't change the third-party default.
      default-days: 3
      exclude:
        - 'rmartz/*'
    commit-message:
      # CI tooling never reaches the shipped artifact, so a GHA bump is a
      # release-less `chore` (without this override it would fall through to `fix`).
      prefix: chore
      include: scope
    groups:
      # Catch-all for patch and minor only; each major opens its own PR
      # (repository checklist default).
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # Split by dependency type: a production bump ships to users, so it is a
      # `fix` that cuts a release; a dev-dependency bump never reaches the
      # shipped artifact, so it is a release-less `chore`.
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # Prettier isolated into its own group (a recorded case-by-case call) so a
      # reformatting bump can't hide in the catch-all — a Prettier minor can
      # reformat the whole tree.
      prettier:
        patterns:
          - 'prettier'
      # TypeScript isolated (case-by-case choice): a compiler bump can change
      # type-checking across the whole codebase, and typescript-eslint pins a
      # supported TS range, so it warrants its own reviewable PR that can wait
      # for the linter without holding back the rest of the dev catch-all.
      typescript:
        patterns:
          - 'typescript'
      # Catch-all groups for patch and minor only; each major opens its own PR
      # (repository checklist default).
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - 'prettier'
          - 'typescript'
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch

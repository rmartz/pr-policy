name: Release

# Automatic releases, tag/npm-as-source-of-truth (Option B, modeled on rmartz/envctl
# and rmartz/repo-hygiene). semantic-release runs on every push to main through the
# fleet's shared workflow (rmartz/semantic-release-ci): it analyzes the
# conventional-commit subjects since the last vX.Y.Z tag, computes the next version,
# publishes @rmartz/pr-policy to npmjs, creates the git tag + GitHub Release, and
# comments on released PRs/issues. The publish runs in the `prepare` step
# (@semantic-release/exec `npm publish`, with @semantic-release/npm's own publish
# off), which is before semantic-release pushes the tag — so a failed publish stops
# the release without leaving a tag that has no package. The release toolchain (semantic-release, its
# plugins and the changelog preset) lives in semantic-release-ci, where a toolchain
# bump is tested before it reaches this pin; the options stay here in .releaserc.json.
#
# npm auth is OIDC trusted publishing: npmjs trusts THIS workflow file
# (`release.yml`) in rmartz/pr-policy — npm validates the calling workflow's
# filename — so there is no NPM_TOKEN secret. Renaming this file breaks publishing
# until the trusted publisher on npmjs is updated to match. Provenance attestations
# are generated automatically. OIDC publishing needs npm >= 11.5.1: the shared
# workflow runs on Node 24 (npm 11) and, because this workflow grants
# `id-token: write`, fails before tagging if npm is older.
#
# There is deliberately NO @semantic-release/git plugin: package.json is never bumped
# back to main (it stays a placeholder — see its "version" field), so the released
# version lives ONLY in the git tag. Consumers never read package.json either: the
# distribution wrapper pins a released version (docs/distribution.md). Only the
# built-in GITHUB_TOKEN is used — no PAT, no commit-back to a protected branch. See
# AGENTS.md.
#
# Staying on 0.x: while pre-1.0, a breaking change is capped at a MINOR bump (see the
# `{ "breaking": true, "release": "minor" }` rule in .releaserc.json) so an accidental
# `!` cannot auto-jump to 1.0.0. Cutting 1.0.0 is a deliberate manual act at go-live,
# after which that cap rule is removed and breaking → major resumes.

on:
  push:
    branches: [main]

# The shared workflow declares no permissions of its own; it runs with these.
# Releases are serialized per repository inside it.
permissions:
  contents: write # create tags and GitHub releases
  id-token: write # npm trusted publishing (OIDC) + provenance
  issues: write # semantic-release comments on released issues
  pull-requests: write # semantic-release comments on released PRs

jobs:
  release:
    uses: rmartz/semantic-release-ci/.github/workflows/semantic-release.yml@dbcbcd8e0425ae4c0aa294d6595566ac4643a83d # v1.1.0
    with:
      # Build dist/ before `npm publish` packs it; the shared workflow
      # installs this repo's dependencies (pnpm, frozen lockfile) first.
      build-command: pnpm run build

name: pr-policy

# This repo's own policy gate, through the exact caller every consumer uses
# (rmartz/pr-policy-action docs/consuming.md). The `@<sha>` pin is bumped by
# Dependabot's github-actions ecosystem, so a new pr-policy release gates this repo
# once the Action re-releases with it — this repo is judged by the released
# policy, never by the code under review.
#
# pull_request_target (not pull_request) so Dependabot and fork PRs still get a
# token that can post the check-run and label. Safe because nothing checks out or
# runs PR code: the CLI reads the PR through the API. The `status` trigger
# re-runs the gate when pr-lifecycle posts its `pr-lifecycle/sign-off` status; a
# `status` workflow also runs from the default branch, so the same safety holds.
#
# The job is deliberately NOT named `pr-policy`: the CLI posts a check-run with
# exactly that name, which the default-branch ruleset requires.

on:
  status:
  pull_request_target:
    # ready_for_review / converted_to_draft re-judge a WIP title on a draft flip.
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        labeled,
        unlabeled,
        ready_for_review,
        converted_to_draft,
      ]

permissions:
  checks: write # post the pr-policy check-run
  pull-requests: write # write the labels pr-policy owns (CI approval needed)
  contents: read # read changed files at the merge base and head
  statuses: write # post the pr-policy commit status and one per policy check (pr-policy / <check>)

concurrency:
  # A status event has no PR number; group it by its commit and context. The
  # context matters: the job `if` only skips the job, the run still enters the
  # group, so an ungrouped status (pr-policy's own, Vercel's, merge-safety's)
  # would cancel an evaluate run that is still posting. Only a newer sign-off
  # status then supersedes an older one.
  group: pr-policy-${{ github.event.pull_request.number || format('{0}-{1}', github.event.sha, github.event.context) }}
  cancel-in-progress: true

jobs:
  pr-policy:
    name: pr-policy (evaluate)
    # Every commit status fires `status`, including pr-policy's own; only
    # pr-lifecycle's sign-off status re-runs the gate.
    if: github.event_name != 'status' || github.event.context == 'pr-lifecycle/sign-off'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # On a status event `pr` is empty: the Action evaluates every open PR
      # whose head is the event's commit.
      - uses: rmartz/pr-policy-action@6bc1c22dabf9c6ac5343ef3464a69b749d0536a2 # v1.9.2
        with:
          pr: ${{ github.event.pull_request.number }}
          # pr-lifecycle posts its sign-off status as the rmartz-pr-lifecycle App;
          # trust that App's bot account (exact login, Bot accounts only).
          sign-off-status-creators: rmartz-pr-lifecycle[bot]
          # Retitle a Dependabot linter/formatter bump to ci(...), the type the
          # pr-policy title check requires for it, instead of blocking on a hand edit.
          retitle-dependabot-ci: true
          # UAT is off for this repo by choice; the library it ships is still user-facing.
          skip-uat: true
